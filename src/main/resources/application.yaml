spring:
  application:
    name: shipments
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:XEPDB1}
    username: ${ORACLE_USER:rutaexpress}
    password: ${ORACLE_PASSWORD:rutaexpress}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Los serializadores (clave String, valor JSON del EventEnvelope) se fijan en KafkaProducerConfig.
    producer:
      # Confirmación solo cuando el mensaje está en todas las réplicas en sincronía (min.insync.replicas=2).
      acks: all
      # Reintentos ante fallas transitorias; con idempotencia no generan duplicados ni desorden.
      retries: 10
      compression-type: lz4
      properties:
        enable.idempotence: true
        # Tope total para entregar un mensaje, reintentos incluidos (debe ser >= linger.ms + request.timeout.ms).
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        # Espera breve para agrupar mensajes en un mismo lote.
        linger.ms: 5
        # Máximo que send() bloquea la hebra HTTP si el clúster no responde (por defecto son 60 s).
        max.block.ms: 5000

  rabbitmq:
    # Lista de nodos del clúster: si el primero no responde, Spring se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Confirmación de publicación: el broker avisa si rechaza un mensaje o si no lo puede enrutar.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8081

security:
  jwt:
    issuer-uri: https://login.microsoftonline.com/${TENANT_ID}/v2.0
    audience: ${API_CLIENT_ID}

services:
  catalog-url: ${CATALOG_URL:http://catalog-svc:8082}

internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-key}

messaging:
  kafka:
    topic-events: shipments.events
    topic-audit: audit.timeline

# Contrato de topología RabbitMQ: shipments solo publica, así que usa el exchange y las routing keys.
rutaexpress:
  rabbitmq:
    exchanges:
      direct: cmd.direct
    email:
      routing-key: email.send
    warehouse:
      routing-key: warehouse.ticket
    label:
      routing-key: label.gen
