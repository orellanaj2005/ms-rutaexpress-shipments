spring:
  application:
    name: shipments
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:XEPDB1}
    username: ${ORACLE_USER:rutaexpress}
    password: ${ORACLE_PASSWORD:rutaexpress}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  rabbitmq:
    # Lista de nodos del clúster: si el primero no responde, Spring se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Confirmación de publicación: el broker avisa si rechaza un mensaje o si no lo puede enrutar.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8081

security:
  jwt:
    issuer-uri: https://login.microsoftonline.com/${TENANT_ID}/v2.0
    audience: ${API_CLIENT_ID}

services:
  catalog-url: ${CATALOG_URL:http://catalog-svc:8082}

internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-key}

messaging:
  kafka:
    topic-events: shipments.events

# Contrato de topología RabbitMQ: shipments solo publica, así que usa el exchange y las routing keys.
rutaexpress:
  rabbitmq:
    exchanges:
      direct: cmd.direct
    email:
      routing-key: email.send
    warehouse:
      routing-key: warehouse.ticket
    label:
      routing-key: label.gen
